<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node.js HTML Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: white;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      font-size: 2.5rem;
      margin: 0;
    }

    p {
      color: #555;
      font-size: 1rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ยินดีต้อนรับสู่ Node.js</h1>
    <p>นี่คือหน้า HTML ที่เสิร์ฟด้วย Node.js อย่างง่าย</p>
  </div>
</body>
</html>
